[general]
live_config_reload = true

[colors]
primary = { background = "#18191A", foreground = "#cdcdcd" }
cursor = { text = "#18191a", cursor = "#d2a374" }
selection = { text = "#151515", background = "#d0d0d0" }
normal = { black = "#18191a", red = "#be8c8c", green = "#a1b3b9", yellow = "#deb896", blue = "#8ca0dc", magenta = "#b9a3ba", cyan = "#bad1ce", white = "#cdcdcd" }
bright = { black = "#505050", red = "#d2788c", green = "#8faf77", yellow = "#d2a374", blue = "#7894ab", magenta = "#b9a3ba", cyan = "#c7c7d4", white = "#f5f5f5" }

[window]
    option_as_alt = "Both"
    decorations = "none"
    # decorations = "Buttonless"
    startup_mode = "Maximized"

[font]
    normal = { family = "Consolas NF" }
    size = 13.5
    bold = { family = "Consolas NF" }
    italic = { family = "Consolas NF" }
    bold_italic = { family = "Consolas NF" }

[keyboard]
    bindings = [
        { key = "p", mods = "Command", chars = "~/utils/tmux-sessionizer\n" },
        { key = "Key6", mods = "Control", chars = "\u001e" }
    ]
