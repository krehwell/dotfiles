[env]
    TERM = "xterm-256color"

[general]
live_config_reload = true
import = [
    "~/.config/alacritty/themes/themes/base16_default_dark.toml"
]

[window]
    option_as_alt = "Both"
    decorations = "none"
    # decorations = "Buttonless"
    startup_mode = "Maximized"

[font]
    normal = { family = "Consolas Nerd Font Mono" }
    size = 15.7
    bold = { family = "Consolas Nerd Font Mono" }
    italic = { family = "Consolas Nerd Font Mono" }
    bold_italic = { family = "Consolas Nerd Font Mono" }

[keyboard]
    bindings = [
        { key = "p", mods = "Command", chars = "~/utils/tmux/tmux-sessionizer\n" },
        { key = "Key6", mods = "Control", chars = "\u001e" },
        { key = "F10", action = "ToggleMaximized" },
        { key = "Return", mods = "Shift", chars = "\n" }
    ]

[selection]
    save_to_clipboard = true

