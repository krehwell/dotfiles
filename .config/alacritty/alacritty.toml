[general]
    live_config_reload = true
    # No color import: base16-shell is the sole source of truth, painting the
    # palette via escapes on shell startup (persisted in ~/.base16_theme).

[colors]
    # Don't brighten bold text (#d8d8d8 -> #f8f8f8); keep one uniform white
    # so bold output matches Claude Code / shell / nvim exactly.
    # draw_bold_text_with_bright_colors = false

[window]
    option_as_alt = "Both"
    decorations = "none"
    # decorations = "Buttonless"
    startup_mode = "Maximized"

[font]
    normal = { family = "Consolas Nerd Font Mono" }
    size = 15.3
    bold = { family = "Consolas Nerd Font Mono" }
    italic = { family = "Consolas Nerd Font Mono" }
    bold_italic = { family = "Consolas Nerd Font Mono" }

[keyboard]
    bindings = [
        { key = "F1", chars = "~/utils/tmux/tmux-sessionizer\n" },
        { key = "Key6", mods = "Control", chars = "\u001e" },
        { key = "F10", action = "ToggleMaximized" },
        { key = "Return", mods = "Shift", chars = "\n" }
    ]

[selection]
    save_to_clipboard = true

