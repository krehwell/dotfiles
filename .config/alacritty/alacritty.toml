[general]
    live_config_reload = true

[colors]
    draw_bold_text_with_bright_colors = true

[window]
    option_as_alt = "Both"
    # decorations = "none"
    # decorations = "Buttonless"
    # startup_mode = "Maximized"

[font]
    normal = { family = "Consolas Nerd Font Mono" }
    size = 15.4
    bold = { family = "Consolas Nerd Font Mono" }
    italic = { family = "Consolas Nerd Font Mono" }
    bold_italic = { family = "Consolas Nerd Font Mono" }

[keyboard]
    bindings = [
        { key = "Key6", mods = "Control", chars = "\u001e" },
        { key = "F10", action = "ToggleMaximized" },
        { key = "F", mods = "Command|Control", action = "ToggleSimpleFullscreen" },
        { key = "Tab", mods = "Control", chars = "\u001b[9;5u" },
        { key = "Return", mods = "Shift", chars = "\u001b[13;2u" }, # shift enter
        { key = "Escape", mods = "Command", action = "ClearLogNotice" }, # dismiss error banner
        { key = "[", mods = "Command|Control", action = "ClearLogNotice" },
    ]

[selection]
    save_to_clipboard = true

