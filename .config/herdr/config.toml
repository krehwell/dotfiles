onboarding = false
[[keys.command]]
key = "prefix+ctrl+p"
type = "popup"
command = "~/utils/tmux/tmux-sessionizer"
description = "open project workspace"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+ctrl+s"
type = "shell"
command = "~/utils/tmux/tmux-session save"
description = "save workspace layout"

[[keys.command]]
key = "prefix+ctrl+o"
type = "shell"
command = "~/utils/tmux/tmux-session restore"
description = "restore missing tabs from layout"

[keys]
last_pane = "prefix+l"          # like tmux prefix+l: jump back to the last pane
focus_pane_left = "prefix+left"    # pane navigation on arrows, tmux style
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

[ui]
prompt_new_tab_name = false
# tab_bar_position = "bottom"

status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"  # in-app toast when an agent finishes or needs input; prefix+o jumps to it

[theme]
name = "catppuccin"
auto_switch = false
