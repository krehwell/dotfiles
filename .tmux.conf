# ----- FIX VIM COLOR SCHEME IN TMUX -----
# Inform tmux that support 256 colors and the host terminal supports True Color (RGB) and undercurls (usstyle)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB:usstyle:extkeys:hyperlinks"


set -g history-limit 10000


# ----- PREVENT DELAY FOR VIM `CTRL + [` -----
set -sg escape-time 0


# ----- SET NEW WINDOW INITIAL PATH BASED FROM CURRENT WINDOW -----
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


# ----- BIND FOR MOVING-WINDOW
bind-key "C-p" display-popup -E -w 80% -h 80% "~/utils/tmux/tmux-sessionizer"
bind-key "C-l" run-shell "~/utils/tmux/tmux-clear-windows"
bind-key P swap-window -t -1\; select-window -t -1
bind-key N swap-window -t +1\; select-window -t +1


# ----- BEHAVIOUR CONFIGURATION -----
set-option -g set-titles on
set-option -g set-titles-string "#S / #W"
set-option -g mouse on
set -s set-clipboard on
set -g focus-events on
set -g allow-passthrough on
set -s extended-keys always


# ----- Vi MODE -----
setw -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane # don't reset scroll upon mouse drag
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi "C-c" send-keys -X copy-selection
bind -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi w send-keys -X next-word-end
bind-key -T copy-mode-vi / command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi "C-o" send-keys -X copy-pipe-and-cancel "xargs -I{} ~/utils/tmux/tmux-smart-edit {}"


# ----- PANE BORDER -----
set -g pane-border-lines heavy


# ----- THE BAR BELOW CONFIGURATION ----
# colour20=base04 (muted grey, separators), colour7=base05 (fg, readable),
# colour15=base07 (brightest) — all follow the active tinted-shell theme.
set-option -g status-style bg=default
set-option -g status-style fg="colour20"
set-option -g status-left-length 100
set-option -g status-right-length 100

# (branch-name) "file-name (path)" time
# title capped at client_width/2 - 25 (room for branch/time) with … when cut
set-option -g status-right "#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/.*/(&)/') #{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=/#{e|-:#{e|/:#{client_width},2},25}/…:pane_title}\" %H:%M"
setw -g window-status-current-format ' #I#[fg=colour20]:#[fg=colour15,bold]#W#[fg=cyan]#F'
setw -g window-status-format ' #I#[fg=colour20]:#[fg=colour20]#W#[fg=colour20]#F'
