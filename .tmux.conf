# ----- FIX VIM COLOR SCHEME IN TMUX -----
# Advertise inside tmux that we support 256 colors
set -g default-terminal "tmux-256color"
# Inform tmux that the host terminal supports True Color (RGB) and undercurls (usstyle)
set -as terminal-features ",*:RGB:usstyle"


set -g history-limit 10000


# ----- PREVENT DELAY FOR VIM `CTRL + [` -----
set -sg escape-time 0


# ----- SET NEW WINDOW INITIAL PATH BASED FROM CURRENT WINDOW -----
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


bind-key i run-shell "tmux neww ~/utils/cht.sh/main"
bind-key "C-p" display-popup -E -w 80% -h 80% "~/utils/tmux/tmux-sessionizer"
bind-key "C-l" run-shell "~/utils/tmux/tmux-clear-windows"
# ----- BIND FOR MOVING-WINDOW
bind-key k swap-window -t -1\; select-window -t -1
bind-key j swap-window -t +1\; select-window -t +1


# ----- BEHAVIOUR CONFIGURATION -----
set-option -g set-titles on
set-option -g set-titles-string "#S / #W"
set-option -g mouse on
set -s set-clipboard external
set -g focus-events on
set -g allow-passthrough on
set -s extended-keys on


# ----- Vi MODE -----
setw -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane # don't reset scroll upon mouse drag
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi "C-c" send-keys -X copy-selection
bind -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi w send-keys -X next-word-end
bind-key -T copy-mode-vi / command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi "C-o" send-keys -X copy-pipe-and-cancel "xargs -I{} ~/utils/tmux/tmux-smart-edit {}"


# ----- THE BAR BELOW CONFIGURATION ----
set-option -g status-style bg=default
set-option -g status-style fg="#8e8e8e"
set-option -g status-left-length 100
# set-option -g status-right-length 100
set-option -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}\"#{=50:pane_title}\" %H:%M"
setw -g window-status-current-format ' #I#[fg=#8e8e8e]:#[fg=white]#W#[fg=cyan]#F'
setw -g window-status-format ' #I#[fg=#8e8e8e]:#[fg=#8e8e8e]#W#[fg=#8e8e8e]#F'

